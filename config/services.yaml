# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # App core (ModuleManager, Interfaces, Helpers...)
    LifeHub\Core\:
        resource: '../core/'

    # App modules (Habits, Notifications...)
    LifeHub\Modules\:
        resource: '../modules/'

    # -----------------------------------------------------------
    # MODULE ARCHITECTURE DISCOVERY (Core Feature)
    # Custom tag applied to every class that implements this interface (used for the modules declarations)
    # -----------------------------------------------------------
    _instanceof:
        LifeHub\Core\Interface\LifeHubModuleInterface:
            tags: ['lifehub.module'] # All module classes (e.g., HabitsModule) are now marked with this tag.

    # ModuleManager Definition and Tagged Injection (The Orchestrator)
    LifeHub\Core\Service\ModuleManager:
        # Inject an Iterator (collection) of ALL services marked with the 'lifehub.module' tag.
        # This is the core mechanism for finding all modules without knowing their names (Decoupling).
        # !tagged_iterator ensures Lazy Loading performance: services are only instantiated when iterated.
        arguments:
            $modules: !tagged_iterator lifehub.module

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
